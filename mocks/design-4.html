<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>四色ぬりわけ デザイン案 4（地図帳）</title>
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700&family=Zen+Old+Mincho:wght@500;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --sea:#D3E3E8;      /* 海（地図の外） */
  --grat:#BCD2DA;     /* 経緯線 */
  --paper:#FBFBF8;    /* 紙・塗っていない陸 */
  --ink:#22324A;      /* 地図帳の紺 */
  --sub:#5C6A7A;
  --rule:#C9D3DB;
  --c0:#F2DC55;       /* 黄 */
  --c1:#7DBFE8;       /* 空色 */
  --c2:#3BA487;       /* 青みの緑 */
  --c3:#D488B6;       /* 赤紫 */
  --conf:#E1262C;
  --gothic:"Zen Kaku Gothic New","Hiragino Sans","Noto Sans JP",sans-serif;
  --mincho:"Zen Old Mincho","Hiragino Mincho ProN","Noto Serif JP",serif;
}
*{box-sizing:border-box}
body{margin:0;background:#E4E6E3;color:var(--ink);font-family:var(--gothic)}
.intro{max-width:1640px;margin:0 auto;padding:22px 24px 6px}
.intro h1{font-family:var(--mincho);font-weight:900;font-size:24px;margin:0 0 6px;letter-spacing:.04em}
.intro p{margin:0;font-size:14px;line-height:1.75;color:#3d4a5a;max-width:72em}
.row{display:flex;gap:24px;justify-content:center;padding:18px 24px 30px}
.cell{display:flex;flex-direction:column;align-items:center;gap:10px}
.cell figcaption{font-size:13px;color:var(--sub)}
.phone{width:390px;height:844px;border-radius:34px;overflow:hidden;position:relative;background:var(--paper);
  box-shadow:0 0 0 9px #1c1f24,0 18px 40px rgba(20,30,40,.25);display:flex;flex-direction:column}
.status{height:44px;flex:none;display:flex;align-items:center;justify-content:space-between;padding:0 26px;font-size:14px;font-weight:700}
.status i{display:inline-block;width:22px;height:11px;border:1.5px solid currentColor;border-radius:3px;vertical-align:middle}

/* 地図の部品（どの画面でも共通） */
svg.map{display:block}
svg.map .r{stroke-linejoin:round;vector-effect:non-scaling-stroke}
svg.map .bd{fill:none;stroke:var(--ink);stroke-linejoin:round;vector-effect:non-scaling-stroke}
svg.map .cf1{fill:none;stroke:var(--conf);stroke-width:8;stroke-linecap:round;stroke-linejoin:round;vector-effect:non-scaling-stroke}
svg.map .cf2{fill:none;stroke:#fff;stroke-width:2.6;stroke-dasharray:5 5;stroke-linecap:butt;vector-effect:non-scaling-stroke}
svg.map text{font-family:var(--mincho);font-weight:700;fill:var(--ink);paint-order:stroke;stroke:rgba(251,251,248,.85);stroke-width:4px;stroke-linejoin:round;text-anchor:middle;dominant-baseline:central}

/* 地域数: 地図帳の索引のページ番号のように、右の欄に数字を大きく */
.cnt{flex:none;display:flex;flex-direction:column;align-items:center;justify-content:center;min-width:62px;padding-left:12px;border-left:1px solid var(--rule);line-height:1}
.cnt b{font-family:var(--gothic);font-weight:700;font-size:28px;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.cnt small{font-size:11px;color:var(--sub);margin-top:4px;letter-spacing:.1em}

/* ---------- 1 トップ ---------- */
.scroll{flex:1;overflow:auto;scrollbar-width:none}
.scroll::-webkit-scrollbar{display:none}
.top .scroll{padding:6px 18px 30px}
.brand{display:flex;align-items:flex-end;justify-content:space-between;margin:6px 2px 4px}
.brand h2{font-family:var(--mincho);font-weight:900;font-size:30px;margin:0;letter-spacing:.06em}
.sw{display:grid;grid-template-columns:repeat(2,11px);gap:3px;margin-bottom:7px}
.sw i{width:11px;height:11px;display:block}
.lead{margin:2px 2px 14px;font-size:13px;color:var(--sub);line-height:1.6}
/* 日本地図: 地図帳の図郭（二重の枠）で囲む */
.plate{display:block;width:100%;text-align:left;cursor:pointer;font:inherit;color:inherit;background:var(--sea);
  border:3px solid var(--ink);outline:1px solid var(--ink);outline-offset:-7px;padding:12px 12px 0;position:relative}
.plate .grat{position:absolute;inset:0;background-image:linear-gradient(var(--grat) 1px,transparent 1px),linear-gradient(90deg,var(--grat) 1px,transparent 1px);background-size:44px 44px;background-position:-1px -1px;opacity:.7}
.plate svg{position:relative;width:100%;height:220px}
.plate .foot{position:relative;display:flex;align-items:center;justify-content:space-between;background:var(--paper);margin:0 -12px;padding:10px 16px;border-top:1px solid var(--ink)}
.plate .foot span{font-family:var(--mincho);font-weight:900;font-size:24px;letter-spacing:.04em}
.sec{margin:22px 2px 8px;font-size:13px;color:var(--sub)}
.region{margin-bottom:14px}
.entry{display:flex;align-items:center;gap:12px;width:100%;font:inherit;color:inherit;text-align:left;cursor:pointer;background:var(--paper);
  border:1.5px solid var(--ink);padding:8px 12px 8px 8px}
.entry .th{width:78px;height:62px;flex:none;background:var(--sea)}
.entry .th svg{width:100%;height:100%}
.entry .nm{flex:1;font-family:var(--mincho);font-weight:900;font-size:21px;letter-spacing:.03em;white-space:nowrap}
.entry .nm small{font-size:15px;font-weight:700;letter-spacing:0}
.prefs{display:grid;grid-template-columns:repeat(4,1fr);border-left:1.5px solid var(--ink);margin-left:20px}
.prefs button{font:inherit;font-family:var(--mincho);font-weight:700;font-size:15px;color:var(--ink);background:none;border:none;border-bottom:1px solid var(--rule);
  padding:11px 0 9px 12px;text-align:left;cursor:pointer}
.credit{font-size:11px;color:var(--sub);margin:20px 2px 0;line-height:1.6}

/* ---------- 2 県のステージ一覧 ---------- */
.bar{flex:none;display:flex;align-items:center;gap:6px;padding:4px 10px 10px}
.bar .bk{font-size:26px;line-height:1;border:none;background:none;color:var(--ink);padding:2px 8px;cursor:pointer}
.bar .crumb{font-size:13px;color:var(--sub)}
.pref .scroll{padding:0 18px 24px}
.pref h3{font-family:var(--mincho);font-weight:900;font-size:34px;margin:0 2px 14px;letter-spacing:.08em}
/* 県全体: 紺地の「全図」。部分のステージとは地の色も大きさも変える */
.whole{display:block;width:100%;cursor:pointer;font:inherit;text-align:left;background:var(--ink);color:#fff;border:3px solid var(--ink);outline:1px solid rgba(255,255,255,.55);outline-offset:-7px;padding:14px 14px 0}
.whole svg{width:100%;height:190px;display:block}
.whole .bd{stroke:var(--ink)}
.whole .foot{display:flex;align-items:center;justify-content:space-between;padding:10px 4px 12px}
.whole .foot span{font-family:var(--mincho);font-weight:900;font-size:24px;letter-spacing:.04em}
.whole .cnt{border-left-color:rgba(255,255,255,.3)}
.whole .cnt small{color:rgba(255,255,255,.7)}
.note{margin:18px 2px 6px;font-size:13px;color:var(--sub)}
.part{display:flex;align-items:center;gap:12px;width:100%;font:inherit;color:inherit;text-align:left;cursor:pointer;background:none;border:none;border-bottom:1px solid var(--rule);padding:10px 2px}
.part .loc{width:64px;height:56px;flex:none}
.part .loc svg{width:100%;height:100%}
.part .nm{flex:1;font-family:var(--mincho);font-weight:700;font-size:19px;letter-spacing:.02em}

/* ---------- 3 ゲーム中 ---------- */
.game{background:var(--sea)}
.game .status{background:var(--paper)}
.ghead{flex:none;display:flex;align-items:center;gap:6px;padding:4px 12px 10px 4px;background:var(--paper);border-bottom:1.5px solid var(--ink)}
.ghead .bk{font-size:26px;border:none;background:none;color:var(--ink);padding:2px 10px;cursor:pointer}
.ghead .t{flex:1;font-family:var(--mincho);font-weight:900;font-size:19px;letter-spacing:.03em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ghead .t small{display:block;font-family:var(--gothic);font-weight:500;font-size:11px;color:var(--sub);letter-spacing:0}
.timer{font-weight:700;font-size:26px;font-variant-numeric:tabular-nums}
.field{flex:1;position:relative;overflow:hidden}
.field .grat{position:absolute;inset:0;background-image:linear-gradient(var(--grat) 1px,transparent 1px),linear-gradient(90deg,var(--grat) 1px,transparent 1px);background-size:52px 52px}
.field svg{position:absolute;inset:0;width:100%;height:100%}
.gfoot{flex:none;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 16px 26px;background:var(--paper);border-top:1.5px solid var(--ink)}
.left{display:flex;align-items:baseline;gap:6px;font-size:13px;color:var(--sub)}
.left b{font-size:30px;color:var(--ink);font-variant-numeric:tabular-nums;line-height:1}
.tog{display:flex;align-items:center;gap:10px;font-size:13px;font-weight:500;cursor:pointer}
.tog .key{width:30px;height:10px;background:var(--conf);position:relative}
.tog .key::after{content:"";position:absolute;left:0;right:0;top:4px;height:2px;background:repeating-linear-gradient(90deg,#fff 0 4px,transparent 4px 8px)}
.sw2{width:46px;height:28px;border-radius:14px;background:var(--ink);position:relative;flex:none}
.sw2::after{content:"";position:absolute;right:3px;top:3px;width:22px;height:22px;border-radius:50%;background:#fff}

/* ---------- 4 クリア（共有画像と同じ見た目） ---------- */
.clear{background:var(--sea)}
.clear .body{flex:1;display:flex;flex-direction:column;padding:6px 16px 26px;gap:14px}
.card{flex:1;background:var(--paper);border:3px solid var(--ink);outline:1px solid var(--ink);outline-offset:-8px;padding:22px 20px 14px;display:flex;flex-direction:column;align-items:center}
.card .nm{font-family:var(--mincho);font-weight:900;font-size:22px;letter-spacing:.06em}
.card .tm{font-family:var(--mincho);font-weight:900;font-size:64px;line-height:1.05;font-variant-numeric:tabular-nums;letter-spacing:.01em;margin:2px 0 4px}
.card svg{width:100%;flex:1;min-height:0}
.card .sig{display:flex;align-items:center;gap:8px;font-family:var(--mincho);font-weight:700;font-size:13px;color:var(--sub);margin-top:8px}
.card .sig .sw{margin:0;grid-template-columns:repeat(4,9px);gap:2px}
.card .sig .sw i{width:9px;height:9px}
.acts{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.acts button{font:inherit;font-weight:700;font-size:15px;padding:14px 0;border:1.5px solid var(--ink);background:var(--paper);color:var(--ink);cursor:pointer}
.acts .main{grid-column:1/-1;background:var(--ink);color:#fff;font-size:17px;padding:16px 0}
button:focus-visible{outline:3px solid var(--c1);outline-offset:2px}
</style>
</head>
<body>
<div class="intro">
  <h1>案 4　地図帳</h1>
  <p>学校の地図帳を下敷きにした案。海の水色と経緯線、図郭の二重線、地名は明朝、操作の文字はゴシック。ステージの入口には、その地図そのものを小さく描いて形で選べるようにした。地域数は地図帳の索引のページ番号のように右の欄に大きく置き、「県全体」は紺地の全図として部分のステージ（白地＋県内での位置図）と分ける。4 色は色覚の型によらず見分けやすい Okabe–Ito 系（黄・空色・緑・赤紫）で、明るさにも差を付けた。同じ色の境目は赤に白の破線を重ねて、色だけでなく模様でも分かるようにした。</p>
</div>
<div class="row">
  <figure class="cell" style="margin:0">
    <div class="phone top">
      <div class="status"><span>9:41</span><i></i></div>
      <div class="scroll">
        <div class="brand"><h2>四色ぬりわけ</h2><div class="sw"><i style="background:var(--c0)"></i><i style="background:var(--c1)"></i><i style="background:var(--c2)"></i><i style="background:var(--c3)"></i></div></div>
        <p class="lead">地域をタップすると色が変わります。<br>となりどうしを違う色に塗り分けます。</p>
        <button class="plate" id="jp"><div class="grat"></div><svg class="map" id="th-000"></svg><div class="foot"><span>日本地図</span><span class="cnt"><b id="jp-n"></b><small>地域</small></span></div></button>
        <div class="sec">地方から選ぶ</div>
        <div id="blocks"></div>
        <p class="credit">出典：国土交通省 国土数値情報（行政区域データ 2025年）をもとに加工して作成</p>
      </div>
    </div>
    <figcaption>1　トップ（選択画面）</figcaption>
  </figure>

  <figure class="cell" style="margin:0">
    <div class="phone pref">
      <div class="status"><span>9:41</span><i></i></div>
      <div class="bar"><button class="bk" aria-label="もどる">‹</button><span class="crumb">中部地方</span></div>
      <div class="scroll">
        <h3>愛知県</h3>
        <button class="whole" id="whole"><svg class="map" id="th-144"></svg><div class="foot"><span>愛知県全体</span><span class="cnt"><b id="whole-n"></b><small>地域</small></span></div></button>
        <p class="note">地域ごとに分けたステージ</p>
        <div id="parts"></div>
      </div>
    </div>
    <figcaption>2　県のステージ一覧（愛知県）</figcaption>
  </figure>

  <figure class="cell" style="margin:0">
    <div class="phone game">
      <div class="status"><span>9:41</span><i></i></div>
      <div class="ghead"><button class="bk" aria-label="もどる">‹</button><div class="t">名古屋市<small>愛知県</small></div><div class="timer">0:42.7</div></div>
      <div class="field"><div class="grat"></div><svg class="map" id="play"></svg></div>
      <div class="gfoot">
        <div class="left">のこり<b id="left"></b>地域</div>
        <label class="tog"><span class="key" aria-hidden="true"></span>同じ色の境目<span class="sw2" role="switch" aria-checked="true"></span></label>
      </div>
    </div>
    <figcaption>3　ゲーム中（名古屋市）</figcaption>
  </figure>

  <figure class="cell" style="margin:0">
    <div class="phone clear">
      <div class="status"><span>9:41</span><i></i></div>
      <div class="body">
        <div class="card">
          <div class="nm">愛知県 名古屋市</div>
          <div class="tm">1:18.4</div>
          <svg class="map" id="done"></svg>
          <div class="sig"><div class="sw"><i style="background:var(--c0)"></i><i style="background:var(--c1)"></i><i style="background:var(--c2)"></i><i style="background:var(--c3)"></i></div>四色ぬりわけ</div>
        </div>
        <div class="acts"><button class="main">共有</button><button>もう一度</button><button>ほかの地図</button></div>
      </div>
    </div>
    <figcaption>4　クリア（共有画像と同じ見た目）</figcaption>
  </figure>
</div>

<script type="module">
const C = ["#F2DC55", "#7DBFE8", "#3BA487", "#D488B6"];
const PAPER = "#FBFBF8", INK = "#22324A";
const NS = "http://www.w3.org/2000/svg";
const cache = {};
const load = (f) => (cache[f] ??= fetch("/maps/" + f).then((r) => r.json()));
const short = (n) => (n === "北海道" ? n : n.replace(/[都府県]$/, ""));

// 隣接から 4 色の塗り分けを 1 つ求める（次数の大きい順にバックトラック）
function solve(m) {
  const adj = Array.from({ length: m.n }, () => []);
  for (const [a, b] of m.pairs) { adj[a].push(b); adj[b].push(a); }
  const order = [...adj.keys()].sort((a, b) => adj[b].length - adj[a].length);
  const col = new Array(m.n).fill(-1);
  const go = (i) => {
    if (i === order.length) return true;
    const v = order[i];
    for (let c = 0; c < 4; c++) {
      if (adj[v].some((u) => col[u] === c)) continue;
      col[v] = c; if (go(i + 1)) return true;
    }
    col[v] = -1; return false;
  };
  go(0); return col;
}

// fill: 地域ごとの色（null は塗っていない）
function draw(svg, m, { fill, line = 1, pad = 0.04, conflicts = [], labels = false, lineColor = INK, fontSize = 0 }) {
  const [x, y, w, h] = m.box, p = Math.max(w, h) * pad;
  svg.setAttribute("viewBox", `${x - p} ${y - p} ${w + 2 * p} ${h + 2 * p}`);
  svg.setAttribute("preserveAspectRatio", "xMidYMid meet");
  let s = "";
  m.regions.forEach((r, k) => {
    const f = fill(k) ?? PAPER;
    s += `<path class="r" d="${r.d}" fill="${f}" stroke="${f}" stroke-width="1"/>`;
  });
  s += `<path class="bd" d="${m.border}" style="stroke:${lineColor};stroke-width:${line}px"/>`;
  for (const d of conflicts) s += `<path class="cf1" d="${d}"/><path class="cf2" d="${d}"/>`;
  if (labels) m.regions.forEach((r, k) => { s += `<text x="${r.c[0]}" y="${r.c[1]}" style="font-size:${fontSize}px">${m.names[k]}</text>`; });
  svg.innerHTML = s;
}

const DATA = await fetch("/src/data/stages.json").then((r) => r.json());

// ---------- 1 トップ ----------
{
  const jp = await load(DATA.zenkoku.file);
  const col = solve(jp);
  draw(document.getElementById("th-000"), jp, { fill: (k) => C[col[k]], line: 0.7, pad: 0.02 });
  document.getElementById("jp-n").textContent = DATA.zenkoku.n;
  const host = document.getElementById("blocks");
  for (const b of DATA.blocks) {
    const wrap = document.createElement("div"); wrap.className = "region";
    wrap.innerHTML = `<button class="entry"><span class="th"><svg class="map"></svg></span><span class="nm">${b.stage.name.replace(/（(.+)）/, "<small>（$1）</small>")}</span><span class="cnt"><b>${b.stage.n}</b><small>地域</small></span></button>
      <div class="prefs">${b.prefs.map((p) => `<button>${short(p.name)}</button>`).join("")}</div>`;
    host.appendChild(wrap);
    load(b.stage.file).then((m) => { const c = solve(m); draw(wrap.querySelector("svg"), m, { fill: (k) => C[c[k]], line: 0.6, pad: 0.06 }); });
  }
}

// ---------- 2 愛知県 ----------
{
  const aichi = DATA.blocks.flatMap((b) => b.prefs).find((p) => p.name === "愛知県");
  const whole = await load(aichi.whole.file);
  const wc = solve(whole);
  draw(document.getElementById("th-144"), whole, { fill: (k) => C[wc[k]], line: 0.6, pad: 0.02 });
  document.getElementById("whole-n").textContent = aichi.whole.n;
  const host = document.getElementById("parts");
  for (const s of aichi.stages) {
    const label = s.name.replace(aichi.name + " ", "");
    const row = document.createElement("button"); row.className = "part";
    row.innerHTML = `<span class="loc"><svg class="map"></svg></span><span class="nm">${label}</span><span class="cnt"><b>${s.n}</b><small>地域</small></span>`;
    host.appendChild(row);
    // 位置図: 県全体の中で、そのステージに入る市町村を紺で塗る（名古屋市は区に分かれるので市で照合）
    load(s.file).then((m) => {
      const inPart = new Set(label === "名古屋市" ? ["名古屋市"] : m.names);
      draw(row.querySelector("svg"), whole, { fill: (k) => (inPart.has(whole.names[k]) ? INK : "#DCE3E9"), line: 0.4, lineColor: "#93A1AE", pad: 0.03 });
    });
  }
}

// ---------- 3 ゲーム中 / 4 クリア ----------
{
  const m = await load("138.json");
  const sol = solve(m);
  // 半分ほど塗った途中の状態。わざと 1 か所、となりどうしを同じ色にする
  const col = sol.map((c, k) => ([0, 2, 4, 5, 6, 8, 10, 12, 13].includes(k) ? c : -1));
  const pair = m.pairs.find(([a, b]) => col[a] >= 0 && col[b] < 0);
  col[pair[1]] = col[pair[0]];
  const conflicts = m.pairs.filter(([a, b]) => col[a] >= 0 && col[a] === col[b]).map((p) => p[2]);
  draw(document.getElementById("play"), m, { fill: (k) => (col[k] >= 0 ? C[col[k]] : null), line: 1.3, pad: 0.05, conflicts, labels: true, fontSize: 30 });
  document.getElementById("left").textContent = col.filter((c) => c < 0).length;
  draw(document.getElementById("done"), m, { fill: (k) => C[sol[k]], line: 1.3, pad: 0.03 });
}
</script>
</body>
</html>
