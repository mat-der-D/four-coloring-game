<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- ロゴの 4 色（黄・水色・橙・緑）を 2×2 に並べたもの。白い角丸の地に紺の枠で、どの背景のタブでも見えるようにする -->
  <rect x="2" y="2" width="60" height="60" rx="12" fill="#fff" stroke="#1E2B38" stroke-width="3"/>
  <rect x="12" y="12" width="19" height="19" rx="2" fill="#F4D35E"/>
  <rect x="33" y="12" width="19" height="19" rx="2" fill="#7EC4EA"/>
  <rect x="12" y="33" width="19" height="19" rx="2" fill="#EE8B3A"/>
  <rect x="33" y="33" width="19" height="19" rx="2" fill="#2F8F7A"/>
</svg>
