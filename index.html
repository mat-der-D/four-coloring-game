<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>四色ぬりわけ</title>
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700&family=BIZ+UDPMincho:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>
<!-- 選択画面: 日本地図 → 地方（入口のステージ）→ 都道府県 -->
<div id="sel" class="screen on"><div class="scroll" id="top"></div></div>

<!-- 都道府県のステージ一覧 -->
<div id="pref" class="screen">
  <div class="bar"><button class="back" id="pref-back" aria-label="もどる">‹</button><h2 id="pref-name"></h2><span class="sub" id="pref-sub"></span></div>
  <div class="scroll"><div class="list" id="pref-list"></div></div>
</div>

<!-- ゲーム -->
<div id="game" class="screen">
  <div class="gh">
    <button class="back" id="back" aria-label="もどる">‹</button>
    <div class="t"><span id="g-pref"></span><b id="title"></b></div>
    <div class="timer num" id="timer">0:00.0</div>
  </div>
  <div class="field" id="stage">
    <svg id="map" xmlns="http://www.w3.org/2000/svg"><defs id="pats"></defs><g id="vp"><g id="regs"></g><path id="border"/><g id="conf"></g></g></svg>
    <div class="note" id="note" hidden><span class="x">×</span>同じ色の隣りあい <b class="num" id="nconf"></b> か所</div>
    <div id="toast"></div>
  </div>
  <div class="gf">
    <div class="r1">
      <div class="legend" id="legend"><span>タップで順に</span></div>
      <div class="left" id="left"></div>
    </div>
    <label class="tog">
      <span class="k"><span class="cx"><span class="ln"></span><span class="x">×</span></span>同じ色の隣りあいを表示</span>
      <input type="checkbox" id="hl" checked><span class="sw" aria-hidden="true"></span>
    </label>
  </div>
</div>

<!-- クリア: 共有画像と同じ見た目 -->
<div id="clear" class="screen">
  <div class="clr">
    <div class="plate"><div class="in">
      <div class="pn" id="c-pref"></div>
      <div class="nm" id="c-name"></div>
      <svg id="c-map" xmlns="http://www.w3.org/2000/svg"></svg>
      <div class="ft">
        <div class="tm num"><small>タイム</small><span id="c-time"></span></div>
        <div class="by"><span class="mark" id="c-mark"></span>四色ぬりわけ</div>
      </div>
    </div></div>
    <div class="acts"><button class="main" id="b-share">共有</button><button id="b-again">もう一度</button><button id="b-list">ほかの地図</button></div>
  </div>
</div>

<!-- 共有シート: クリア画面の「共有」で下から出る -->
<div id="share" aria-hidden="true">
  <div class="sheet" role="dialog" aria-label="共有する">
    <div class="grab"></div>
    <div class="sh-h"><b>共有する</b><button id="sh-close" aria-label="閉じる">×</button></div>
    <div class="pv"><img id="sh-img" alt="共有画像"><div class="msg" id="sh-msg"></div></div>
    <button class="big" id="sh-native">画像つきで共有…</button>
    <p class="hint" id="sh-hint"></p>
    <div class="lbl">文面とリンクを投稿（画像は下で保存・コピーして添付）</div>
    <div class="sns" id="sh-sns"></div>
    <div class="lbl">保存・コピー</div>
    <div class="acts3">
      <button id="sh-save">画像を保存<small>PNG</small></button>
      <button id="sh-copyimg">画像をコピー<small>クリップボード</small></button>
      <button id="sh-copytxt">文面をコピー<small>リンクつき</small></button>
    </div>
  </div>
  <div class="sh-toast" id="sh-toast"></div>
</div>
<script type="module" src="/src/main.js"></script>
</body>
</html>
